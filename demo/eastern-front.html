<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>EASTERN FRONT</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;touch-action:none;user-select:none}
html,body{width:100%;height:100%;background:#0b0d0a;overflow:hidden;font-family:sans-serif}
#wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
canvas{display:block;max-width:100%;max-height:100%}
#hud{position:absolute;inset:0;pointer-events:none;color:#e8e0c8;text-shadow:0 1px 2px #000}
#topbar{position:absolute;top:8px;left:12px;right:12px;display:flex;justify-content:space-between;font-size:14px}
#hpwrap{width:180px;height:12px;background:#2a1a12;border:1px solid #8a6a3a}
#hp{height:100%;width:100%;background:linear-gradient(90deg,#7a1a12,#c43)}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,10,6,.82);color:#e8e0c8;text-align:center;pointer-events:auto}
button{background:#3a2a14;color:#e8e0c8;border:1px solid #c4a050;padding:12px 28px;font-size:16px}
#rotate{display:none;position:absolute;inset:0;background:#111;color:#ddd;align-items:center;justify-content:center;z-index:20}
@media (orientation:portrait){#rotate{display:flex}canvas,#hud,#overlay{display:none!important}}
</style></head><body>
<div id="wrap"><canvas id="c" width="1280" height="720"></canvas>
<div id="hud"><div id="topbar"><div>HP<div id="hpwrap"><div id="hp"></div></div><div id="ammo">Rifle 30/90</div></div>
<div style="text-align:right"><div id="wave">WAVE 1 / 5</div><div id="kills">KILLS 0</div><div id="gren">GRENADES 3</div></div></div></div>
<div id="overlay"><h1>EASTERN FRONT</h1><p>Слева движение. Справа огонь, кобура, граната. Волны. Потом босс.</p><button id="start">СТАРТ</button></div>
<div id="rotate">Поверни телефон горизонтально</div></div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),W=1280,H=720;
const keys={u:0,d:0,l:0,r:0};const touch={fire:false,holster:false,grenade:false};let holstered=false,game=null;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);const angTo=(a,b)=>Math.atan2(b.y-a.y,b.x-a.x);
class Ent{constructor(x,y){this.x=x;this.y=y;this.a=0;this.hp=100;this.r=16;this.dead=false}}
class Bullet{constructor(x,y,a,spd,dmg,from){this.x=x;this.y=y;this.a=a;this.spd=spd;this.dmg=dmg;this.from=from;this.life=1.4}
update(dt){this.x+=Math.cos(this.a)*this.spd*dt;this.y+=Math.sin(this.a)*this.spd*dt;this.life-=dt}}
class Grenade{constructor(x,y,a){this.x=x;this.y=y;this.vx=Math.cos(a)*260;this.vy=Math.sin(a)*260;this.t=1.05;this.boom=false}
update(dt){this.x+=this.vx*dt;this.y+=this.vy*dt;this.vx*=.98;this.vy*=.98;this.t-=dt;if(this.t<=0)this.boom=true}}
class Game{constructor(){this.reset()}
reset(){this.player=Object.assign(new Ent(220,H/2),{hp:100,max:100,speed:185,mag:30,reserve:90,gren:3,fireCd:0,grenCd:0,aim:0});this.enemies=[];this.bullets=[];this.grenades=[];this.fx=[];this.wave=1;this.maxWave=5;this.kills=0;this.spawnLeft=0;this.spawnT=0;this.waveClearT=0;this.boss=null;this.state='play';this.msg='';this.startWave()}
startWave(){if(this.wave>this.maxWave){this.spawnBoss();return}this.spawnLeft=4+this.wave*3;this.spawnT=.2;this.msg='ВОЛНА '+this.wave}
spawnBoss(){this.boss=Object.assign(new Ent(W-160,H/2),{hp:420,max:420,r:28,fireCd:0,a:Math.PI,phase:0});this.msg='БОСС'}
spawnEnemy(){const y=80+Math.random()*(H-160);this.enemies.push(Object.assign(new Ent(W+30,y),{hp:28+this.wave*8,max:28+this.wave*8,speed:55+this.wave*8,fireCd:.6+Math.random(),r:15,kind:Math.random()<.25?'mg':'rifle'}))}
update(dt){if(this.state!=='play')return;const p=this.player;let dx=(keys.r?1:0)-(keys.l?1:0),dy=(keys.d?1:0)-(keys.u?1:0);if(dx||dy){const n=Math.hypot(dx,dy)||1;p.x+=(dx/n)*p.speed*dt;p.y+=(dy/n)*p.speed*dt}p.x=clamp(p.x,30,W-30);p.y=clamp(p.y,40,H-40);
let target=this.boss&&!this.boss.dead?this.boss:null,best=1e9;for(const e of this.enemies){if(e.dead)continue;const d=dist(p,e);if(d<best){best=d;target=e}}if(target)p.aim=angTo(p,target);else if(dx||dy)p.aim=Math.atan2(dy,dx);
p.fireCd-=dt;p.grenCd-=dt;if(touch.holster){holstered=!holstered;touch.holster=false}
if(!holstered&&touch.fire&&p.fireCd<=0&&p.mag>0){p.mag--;p.fireCd=.16;this.bullets.push(new Bullet(p.x+Math.cos(p.aim)*22,p.y+Math.sin(p.aim)*22,p.aim+(Math.random()-.5)*.06,620,18,'p'))}
if(touch.fire&&p.mag<=0&&p.reserve>0){const n=Math.min(30,p.reserve);p.reserve-=n;p.mag+=n;p.fireCd=.8}
if(touch.grenade){touch.grenade=false;if(p.gren>0&&p.grenCd<=0){p.gren--;p.grenCd=1.1;this.grenades.push(new Grenade(p.x,p.y,p.aim))}}
if(!this.boss){this.spawnT-=dt;if(this.spawnLeft>0&&this.spawnT<=0){this.spawnEnemy();this.spawnLeft--;this.spawnT=Math.max(.35,1.1-this.wave*.12)}if(this.spawnLeft<=0&&this.enemies.every(e=>e.dead)){this.waveClearT+=dt;if(this.waveClearT>1.4){this.waveClearT=0;this.wave++;if(this.wave<=this.maxWave)this.startWave();else this.spawnBoss()}}}
for(const e of this.enemies){if(e.dead)continue;e.a=angTo(e,p);const d=dist(e,p);if(d>90){e.x+=Math.cos(e.a)*e.speed*dt;e.y+=Math.sin(e.a)*e.speed*dt}e.fireCd-=dt;if(e.fireCd<=0&&d<420){e.fireCd=e.kind==='mg'?.22:.85;this.bullets.push(new Bullet(e.x+Math.cos(e.a)*18,e.y+Math.sin(e.a)*18,e.a+(Math.random()-.5)*(e.kind==='mg'?.18:.08),480,e.kind==='mg'?6:12,'e'))}}
if(this.boss&&!this.boss.dead){const b=this.boss;b.phase+=dt;b.a=angTo(b,p);b.y+=(H/2+Math.sin(b.phase)*160-b.y)*dt*1.4;b.x=clamp(b.x+Math.sin(b.phase*.7)*20*dt,W*.55,W-50);b.fireCd-=dt;if(b.fireCd<=0){b.fireCd=.18;for(let i=-2;i<=2;i++)this.bullets.push(new Bullet(b.x,b.y,b.a+i*.12,420,10,'e'));if(Math.random()<.12)this.grenades.push(new Grenade(b.x,b.y,b.a))}}
for(const g of this.grenades){g.update(dt);if(g.boom){this.fx.push({x:g.x,y:g.y,t:.35});for(const t of [p,...this.enemies,this.boss].filter(Boolean)){if(!t.dead&&dist(g,t)<95){t.hp-=t===p?28:55;if(t.hp<=0){t.dead=true;if(t!==p)this.kills++}}}}}
this.grenades=this.grenades.filter(g=>!g.boom);
for(const b of this.bullets){b.update(dt);for(const t of (b.from==='p'?[...this.enemies,this.boss].filter(Boolean):[p])){if(t&&!t.dead&&dist(b,t)<t.r+4){t.hp-=b.dmg;b.life=0;if(t.hp<=0){t.dead=true;if(t!==p)this.kills++}}}}
this.bullets=this.bullets.filter(b=>b.life>0&&b.x>-20&&b.x<W+20);this.fx.forEach(f=>f.t-=dt);this.fx=this.fx.filter(f=>f.t>0);
if(p.hp<=0){p.dead=true;this.state='lose'}if(this.boss&&this.boss.dead)this.state='win';
document.getElementById('hp').style.width=(100*p.hp/p.max)+'%';document.getElementById('ammo').textContent=holstered?'ОРУЖИЕ В КОБУРЕ':('Rifle '+p.mag+'/'+p.reserve);document.getElementById('wave').textContent=this.boss?'БОСС':('WAVE '+Math.min(this.wave,this.maxWave)+' / '+this.maxWave);document.getElementById('kills').textContent='KILLS '+this.kills;document.getElementById('gren').textContent='GRENADES '+p.gren}
draw(){ctx.fillStyle='#2f3a28';ctx.fillRect(0,0,W,H);ctx.fillStyle='#3a4630';for(let i=0;i<18;i++)ctx.fillRect((i*73+40)%W,40+(i%5)*120,90,10);ctx.strokeStyle='#6a5a38';ctx.lineWidth=3;ctx.strokeRect(20,20,W-40,H-40);
const drawS=(e,col,en)=>{ctx.save();ctx.translate(e.x,e.y);ctx.rotate(en?e.a:this.player.aim);ctx.fillStyle=col;ctx.fillRect(-10,-8,22,16);ctx.fillStyle=en?'#3a3a28':'#4a5a38';ctx.beginPath();ctx.arc(2,0,7,0,6.28);ctx.fill();if(!holstered||en){ctx.fillStyle='#222';ctx.fillRect(8,-2,18,4)}ctx.restore();if(e.hp<e.max){ctx.fillStyle='#400';ctx.fillRect(e.x-12,e.y-22,24,4);ctx.fillStyle='#c33';ctx.fillRect(e.x-12,e.y-22,24*(e.hp/e.max),4)}};
drawS(this.player,'#4d6a3a',false);for(const e of this.enemies)if(!e.dead)drawS(e,'#5a5a42',true);
if(this.boss&&!this.boss.dead){const b=this.boss;ctx.save();ctx.translate(b.x,b.y);ctx.fillStyle='#2a2a2a';ctx.fillRect(-22,-16,44,32);ctx.fillStyle='#3b2a18';ctx.beginPath();ctx.arc(0,-22,12,0,6.28);ctx.fill();ctx.fillStyle='#111';ctx.fillRect(-16,-30,32,8);ctx.restore();ctx.fillStyle='#400';ctx.fillRect(b.x-40,b.y-46,80,6);ctx.fillStyle='#c43';ctx.fillRect(b.x-40,b.y-46,80*(b.hp/b.max),6);ctx.fillStyle='#e8e0c8';ctx.font='12px sans-serif';ctx.fillText('BOSS',b.x-16,b.y-52)}
ctx.fillStyle='#e8d080';for(const b of this.bullets){ctx.beginPath();ctx.arc(b.x,b.y,3,0,6.28);ctx.fill()}ctx.fillStyle='#3a4a20';for(const g of this.grenades){ctx.beginPath();ctx.arc(g.x,g.y,6,0,6.28);ctx.fill()}for(const f of this.fx){ctx.strokeStyle='rgba(220,140,40,'+(f.t*2)+')';ctx.lineWidth=4;ctx.beginPath();ctx.arc(f.x,f.y,90*(1-f.t/.35),0,6.28);ctx.stroke()}
this.drawPad();if(this.msg){ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(W/2-140,60,280,36);ctx.fillStyle='#e8d080';ctx.font='20px sans-serif';ctx.textAlign='center';ctx.fillText(this.msg,W/2,85);ctx.textAlign='left'}if(this.state==='win'||this.state==='lose'){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#e8d080';ctx.font='36px sans-serif';ctx.textAlign='center';ctx.fillText(this.state==='win'?'ВОЛНЫ ОТБИТЫ':'ПОРАЖЕНИЕ',W/2,H/2);ctx.textAlign='left'}}
drawPad(){const dc=(x,y,r,on)=>{ctx.beginPath();ctx.arc(x,y,r,0,6.28);ctx.fillStyle=on?'rgba(220,200,140,.35)':'rgba(0,0,0,.28)';ctx.fill();ctx.strokeStyle='rgba(220,200,140,.55)';ctx.stroke()};const cx=110,cy=H-110;dc(cx,cy-52,28,keys.u);dc(cx,cy+52,28,keys.d);dc(cx-52,cy,28,keys.l);dc(cx+52,cy,28,keys.r);ctx.fillStyle='#ddd';ctx.font='18px sans-serif';ctx.textAlign='center';ctx.fillText('▲',cx,cy-46);ctx.fillText('▼',cx,cy+58);ctx.fillText('◀',cx-52,cy+6);ctx.fillText('▶',cx+52,cy+6);const rx=W-130,ry=H-120;dc(rx+10,ry-10,42,touch.fire);dc(rx-70,ry+20,28,holstered);dc(rx+70,ry+36,28,false);ctx.fillStyle='#eee';ctx.fillText('ОГОНЬ',rx+10,ry-4);ctx.font='12px sans-serif';ctx.fillText('КОБУРА',rx-70,ry+24);ctx.fillText('ГРАНАТА',rx+70,ry+40);ctx.textAlign='left'}}
function resize(){const s=Math.min(innerWidth/W,innerHeight/H);canvas.style.width=(W*s)+'px';canvas.style.height=(H*s)+'px'}addEventListener('resize',resize);resize();
function pos(e){const r=canvas.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:(t.clientX-r.left)*W/r.width,y:(t.clientY-r.top)*H/r.height}}
function pad(x,y,down){const inC=(px,py,r)=>Math.hypot(x-px,y-py)<r;if(inC(110,H-162,36))keys.u=down?1:0;else if(inC(110,H-58,36))keys.d=down?1:0;else if(inC(58,H-110,36))keys.l=down?1:0;else if(inC(162,H-110,36))keys.r=down?1:0;const rx=W-130,ry=H-120;if(down&&inC(rx+10,ry-10,48))touch.fire=true;if(!down)touch.fire=false;if(down&&inC(rx-70,ry+20,34))touch.holster=true;if(down&&inC(rx+70,ry+36,34))touch.grenade=true}
canvas.addEventListener('touchstart',e=>{e.preventDefault();for(const t of e.changedTouches){const p=pos(t);pad(p.x,p.y,true)}},{passive:false});
canvas.addEventListener('touchend',e=>{e.preventDefault();keys.u=keys.d=keys.l=keys.r=0;touch.fire=false},{passive:false});
canvas.addEventListener('mousedown',e=>{const p=pos(e);pad(p.x,p.y,true)});
addEventListener('mouseup',()=>{keys.u=keys.d=keys.l=keys.r=0;touch.fire=false});
addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='w')keys.u=1;if(e.key==='ArrowDown'||e.key==='s')keys.d=1;if(e.key==='ArrowLeft'||e.key==='a')keys.l=1;if(e.key==='ArrowRight'||e.key==='d')keys.r=1;if(e.key===' ')touch.fire=true;if(e.key==='q')touch.holster=true;if(e.key==='e')touch.grenade=true});
addEventListener('keyup',e=>{if(e.key==='ArrowUp'||e.key==='w')keys.u=0;if(e.key==='ArrowDown'||e.key==='s')keys.d=0;if(e.key==='ArrowLeft'||e.key==='a')keys.l=0;if(e.key==='ArrowRight'||e.key==='d')keys.r=0;if(e.key===' ')touch.fire=false});
let last=performance.now();function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;if(game){game.update(dt);game.draw()}requestAnimationFrame(loop)}requestAnimationFrame(loop);
document.getElementById('start').onclick=()=>{document.getElementById('overlay').style.display='none';game=new Game()};
</script></body></html>
